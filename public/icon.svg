<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background Circle: Terracotta -->
  <circle cx="32" cy="32" r="30" fill="#D95338" stroke="#171B1E" stroke-width="3.5" />
  
  <!-- Inner Ring: Egyptian Gold -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#D4A359" stroke-width="1.2" stroke-dasharray="2 1.5" />

  <!-- Felucca Tall Triangular Sail: Light Parchment -->
  <path d="M29 10 L44 35 L27 35 Z" fill="#FAF6ED" stroke="#171B1E" stroke-width="1.8" stroke-linejoin="round" />
  
  <!-- Jib Sail -->
  <path d="M25 18 L25 35 L16 35 Z" fill="#FAF6ED" opacity="0.9" stroke="#171B1E" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Mast -->
  <line x1="26" y1="10" x2="26" y2="39" stroke="#171B1E" stroke-width="2" stroke-linecap="round" />

  <!-- Boat Wooden Hull -->
  <path d="M12 37 C18 45, 46 45, 52 37 L48 42 C40 47, 24 47, 16 42 Z" fill="#171B1E" />
  <path d="M14 38 C20 44, 44 44, 50 38 L47 41 C39 45, 25 45, 17 41 Z" fill="#D4A359" />

  <!-- Nile Wave lines below boat -->
  <path d="M15 50 Q 23 46, 32 50 T 49 50" fill="none" stroke="#FAF6ED" stroke-width="2" stroke-linecap="round" />
  <path d="M20 54 Q 26 51, 32 54 T 44 54" fill="none" stroke="#D4A359" stroke-width="1.5" stroke-linecap="round" />
</svg>
